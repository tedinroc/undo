[package]
name = "undo-core"
description = "Pure state machine for Undo vaults. No NEAR tooling."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Storage encoding for the contract. Off by default, so this crate and its tests stay free of
# dependencies.
borsh = ["dep:borsh"]

[dependencies]
borsh = { version = "1", optional = true, features = ["derive"] }
