# Tests for undo-core, in their own workspace. undo-core itself stays free of dependencies, and
# nothing here enters the contract build or the root Cargo.lock.
[package]
name = "undo-core-props"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace]
resolver = "2"

[dependencies]
# The storage encoding too, so a test can read a row the way the contract does after an upgrade.
undo-core = { path = "..", features = ["borsh"] }

[dev-dependencies]
borsh = "=1.8.1"
serde_json = "1"
proptest = "=1.12.0"
bitcoin = { version = "=0.32.102", features = ["bitcoinconsensus"] }

[profile.test]
opt-level = 1
