# Owns the state store and one canary cron. It has no hostname: workers_dev defaults to true when a Worker has
# no routes, and a workers.dev name carries the account's subdomain, so both are off on purpose.
name = "undo-cron"
main = "src/index.mjs"
compatibility_date = "2025-01-15"
workers_dev = false
preview_urls = false
upload_source_maps = false

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "UNDO_STATE"
class_name = "UndoState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UndoState"]

[vars]
NEAR_RPC_URLS = "https://test.rpc.fastnear.com,https://near-testnet.drpc.org,https://rpc.testnet.near.org"
