# An independent referee for tools/test. Not part of any deployed build, and in its own workspace so
# nothing here enters the contract's Cargo.lock.
[package]
name = "undo-tools-check"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace]
resolver = "2"

[dependencies]
undo-btc = { path = "../../crates/undo-btc", features = ["tools"] }
bitcoin = { version = "=0.32.102", features = ["bitcoinconsensus"] }
borsh = { version = "1", features = ["derive"] }
hkdf = "0.12"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
serde_json = "1"
sha2 = "0.10"
